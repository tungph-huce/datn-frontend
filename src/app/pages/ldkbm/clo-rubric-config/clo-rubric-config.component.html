<h2 class="text-2xl font-bold mb-4">Cấu hình CLO & Rubric theo ngành / khóa</h2>
<div class="bg-white border rounded-xl p-5 space-y-4">
 <label class="block">Nhóm chuyên môn <select class="border p-2 rounded" [(ngModel)]="departmentId" (ngModelChange)="onDepartmentChange()"><option *ngFor="let d of departments" [ngValue]="d.id">{{d.name}}</option></select></label>
 <label>Đợt ĐATN <select class="border p-2 rounded" [(ngModel)]="selectedCampaignId" (ngModelChange)="onCampaignChange()"><option *ngFor="let c of campaigns" [ngValue]="c.id">{{c.name}}</option></select></label>
 <p class="text-sm text-slate-500">Mỗi lần lưu tạo một bộ CLO mới. Sau khi lưu, gán bộ vào đợt/ngành/khóa và từng SV tại mục Ngành, CLO SV & Hội đồng.</p>
 <div class="flex flex-wrap gap-4"><label>Ngành<select class="border p-2 rounded ml-2" [(ngModel)]="majorId"><option [ngValue]="null">Chọn ngành</option><option *ngFor="let m of majors" [ngValue]="m.id">{{m.name}}</option></select></label><label>Khóa<input class="border p-2 rounded w-20 ml-2" maxlength="2" [(ngModel)]="cohort"></label></div>
 <label class="block">Chương trình <select class="border p-2 rounded" [(ngModel)]="programType"><option value="STANDARD">Chuẩn</option><option value="STEM">Tài năng / STEM</option></select></label>
 <label class="block">Chính sách hoàn thành <select class="border p-2 rounded" [(ngModel)]="completionRule"><option value="">Chưa xác nhận</option><option value="INCLUSIVE">Từ mức quy định trở lên</option><option value="ABOVE">Trên mức quy định</option></select></label>
 <div class="flex gap-4"><label>M1 % <input class="border p-2 w-20" type="number" min="0" max="100" [(ngModel)]="m1Weight"></label><label>M2 % <input class="border p-2 w-20" type="number" min="0" max="100" [(ngModel)]="m2Weight"></label><label>M3 % <input class="border p-2 w-20" type="number" min="0" max="100" [(ngModel)]="m3Weight"></label><span>Tổng {{totalStageWeight}}%</span></div>
 <div><input [(ngModel)]="newCloSetName" placeholder="Tên bộ CLO mới" class="border p-2 rounded mr-3"><button (click)="startCreatingNew()" class="border rounded p-2">Tạo bộ mới (20/30/50)</button></div>
 <div *ngIf="!hasDefinedCloCount"><label>Số CLO <input type="number" min="1" max="20" [(ngModel)]="cloCount" class="border p-2 w-20"></label><button (click)="defineCloCount()" class="ml-3 p-2 rounded bg-blue-800 text-white">Tạo danh sách CLO</button></div>
 <section *ngFor="let clo of clos; let i=index" class="border rounded p-4 space-y-3">
  <div class="flex gap-3"><input [(ngModel)]="clo.clo_code" aria-label="Mã CLO" class="border p-2 w-24"><input [(ngModel)]="clo.description" placeholder="Nội dung chuẩn đầu ra" class="border p-2 flex-1"><button (click)="removeClo(i)" class="text-red-700">Xóa</button></div>
  <label class="block"><input type="checkbox" [(ngModel)]="clo.required_for_completion"> CLO bắt buộc để công nhận hoàn thành</label>
  <div class="flex flex-wrap gap-4"><label>Alpha % <input type="number" min="0" max="100" [(ngModel)]="clo.alpha_weight" class="border p-2 w-20"></label><label>M1 % <input type="number" min="0" max="100" [(ngModel)]="clo.m1_weight" class="border p-2 w-20"></label><label>M2 % <input type="number" min="0" max="100" [(ngModel)]="clo.m2_weight" class="border p-2 w-20"></label><label>M3 % <input type="number" min="0" max="100" [(ngModel)]="clo.m3_weight" class="border p-2 w-20"></label></div>
  <div *ngFor="let r of clo.rubrics" class="flex gap-3"><span>Mức {{r.score_level}}</span><input [(ngModel)]="r.description" class="border p-2 flex-1" placeholder="Mô tả tiêu chí"></div>
 </section>
 <p>Tổng Alpha: {{totalAlphaWeight}}%</p><button (click)="addClo()" class="p-2 border rounded mr-3">Thêm CLO</button><button (click)="saveConfigs()" [disabled]="isSaving || !isAlphaWeightValid || !isStageWeightValid" class="p-3 bg-blue-800 text-white rounded disabled:opacity-40">Lưu bộ CLO mới</button>
</div>
