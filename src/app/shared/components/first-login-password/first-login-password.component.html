<div class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
  <section #dialog role="dialog" aria-modal="true" aria-labelledby="first-password-title" aria-describedby="first-password-description" class="w-full max-w-lg rounded-2xl bg-white shadow-2xl p-6 sm:p-8 max-h-[95vh] overflow-y-auto">
    <div class="w-12 h-12 rounded-xl bg-blue-50 text-[#00429D] flex items-center justify-center mb-4">
      <span class="material-symbols-outlined text-[28px]">lock_reset</span>
    </div>
    <h2 id="first-password-title" class="text-xl font-bold text-slate-800">Đổi mật khẩu lần đầu</h2>
    <p id="first-password-description" class="text-sm text-slate-600 mt-2">Bạn cần đặt mật khẩu mới trước khi sử dụng các chức năng của hệ thống.</p>
    <p class="text-sm font-medium text-[#00429D] mt-2 break-all">{{ auth.getCurrentUser()?.fullName }} · {{ auth.getCurrentUser()?.email }}</p>
    <form (ngSubmit)="submit()" class="mt-6 space-y-4">
      <fieldset [disabled]="isSaving" class="space-y-4">
        <label class="block text-sm font-medium text-slate-700">Mật khẩu mới
          <input #passwordInput name="newPassword" [(ngModel)]="newPassword" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" required minlength="8" maxlength="72" aria-label="Mật khẩu mới" class="block w-full mt-1 border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-200 focus:border-blue-700 outline-none">
        </label>
        <label class="block text-sm font-medium text-slate-700">Xác nhận mật khẩu mới
          <input name="confirmPassword" [(ngModel)]="confirmPassword" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" required maxlength="72" aria-label="Xác nhận mật khẩu mới" class="block w-full mt-1 border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-200 focus:border-blue-700 outline-none">
        </label>
        <p class="text-xs text-slate-500">Tối thiểu 8 ký tự, khác mật khẩu mặc định và mật khẩu hiện tại.</p>
        <label class="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" name="showPassword" [(ngModel)]="showPassword"> Hiện mật khẩu</label>
      </fieldset>
      <p *ngIf="errorMessage" role="alert" class="text-sm text-red-700 bg-red-50 rounded p-3">{{ errorMessage }}</p>
      <button type="submit" [disabled]="isSaving" class="w-full px-4 py-3 rounded-lg bg-[#00429D] text-white font-semibold hover:bg-blue-800 disabled:opacity-50">{{ isSaving ? 'Đang đổi mật khẩu...' : 'Đổi mật khẩu và tiếp tục' }}</button>
      <button type="button" (click)="auth.logout()" [disabled]="isSaving" class="w-full text-sm text-slate-500 py-1 disabled:opacity-50">Đăng xuất</button>
    </form>
  </section>
</div>
